plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

def mcVersion = project.minecraft_version

base {
	archivesName = project.archives_base_name
}

repositories {
	// Required for Cloth Config.
	maven { url "https://maven.shedaniel.me/" }

	// Required for Mod Menu.
	maven { url "https://maven.terraformersmc.com/releases/" }
}

loom {
	// Separates client-only code from common code.
	// Use this if the mod contains client-only classes, renderers, screens, or key bindings.
	splitEnvironmentSourceSets()

	// Registers both common and client source sets as part of the same Fabric mod.
	// project.mod_id must match the "id" field in fabric.mod.json.
	mods {
		"${project.mod_id}" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	// Minecraft 26.x uses the non-obfuscated setup.
	// Do not add Yarn mappings here.
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Optional integration with Mod Menu.
	api "com.terraformersmc:modmenu:${project.modmenu_version}"

	// Configuration library.
	// Fabric API is excluded because it is already declared above.
	api("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}
}

def resourceProperties = [
	version: project.version,
	minecraft_version: project.minecraft_version,
	loader_version: project.loader_version
]

tasks.named("processResources", ProcessResources) {
	inputs.properties(resourceProperties)

	filesMatching("fabric.mod.json") {
		expand(resourceProperties)
	}
}

tasks.named("processClientResources", ProcessResources) {
	inputs.properties(resourceProperties)

	filesMatching("fabric.mod.json") {
		expand(resourceProperties)
	}
}

tasks.withType(JavaCompile).configureEach {
	// Minecraft 26.x requires Java 25.
	it.options.release = 25
}

java {
	withSourcesJar()

	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	archiveBaseName.set(project.archives_base_name)

	// Include both the mod version and the target Minecraft version in the output jar name.
	// Example: modname-1.0.0+mc26.2.jar
	archiveVersion.set("${project.mod_version}+mc${mcVersion}")

	archiveClassifier.set("")

	from("LICENSE") {
		rename { "${it}_${project.archives_base_name}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
		// Add publishing repositories here if needed.
	}
}